<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>현장 리더 명단</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
:root {
  --bg: #fafaf7;
  --surface: #ffffff;
  --surface-2: #f5f4ef;
  --border: #e6e3db;
  --border-strong: #d5d1c5;
  --text: #1a1816;
  --text-2: #545049;
  --text-3: #8b867d;
  --muted: #b3aea2;

  --accent: oklch(0.48 0.12 265);
  --accent-soft: oklch(0.95 0.02 265);
  --accent-text: oklch(0.35 0.14 265);

  --l1: oklch(0.50 0.13 35);
  --l1-bg: oklch(0.96 0.02 35);
  --l2: oklch(0.48 0.12 265);
  --l2-bg: oklch(0.96 0.02 265);
  --l3: oklch(0.50 0.10 175);
  --l3-bg: oklch(0.96 0.02 175);

  --domestic: oklch(0.50 0.10 175);
  --domestic-bg: oklch(0.95 0.03 175);
  --overseas: oklch(0.48 0.12 35);
  --overseas-bg: oklch(0.96 0.03 35);
  --branch-bg: oklch(0.95 0.02 265);
  --branch-text: oklch(0.35 0.14 265);

  --warn: oklch(0.58 0.16 30);
  --warn-bg: oklch(0.97 0.02 30);

  --header-h: 78px;

  --shadow-sm: 0 1px 2px rgba(20, 18, 14, 0.04);
  --shadow: 0 2px 8px rgba(20, 18, 14, 0.06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { min-height: 100vh; }

.app {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px 24px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--text);
  color: var(--bg);
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
}
.brand-title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.nav { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.nav-item {
  all: unset; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 8px 10px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.is-active { background: var(--text); color: var(--surface); }
.nav-item.is-active .nav-count { color: rgba(255,255,255,0.7); }
.nav-label { font-weight: 500; letter-spacing: -0.01em; }
.nav-count { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 500; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 4px; }

.legend {
  margin-top: 18px;
  padding: 12px 10px;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 11px;
  color: var(--text-2);
}
.legend-title { font-weight: 600; color: var(--text); margin-bottom: 8px; letter-spacing: -0.01em; }
.legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; line-height: 1.4; }
.chip {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 1px 6px; border-radius: 3px; flex-shrink: 0;
}
.chip-l1 { background: var(--l1-bg); color: var(--l1); }
.chip-l2 { background: var(--l2-bg); color: var(--l2); }
.chip-l3 { background: var(--l3-bg); color: var(--l3); }

.kubun-chip {
  display: inline-block;
  font-size: 10px; font-weight: 600;
  padding: 1px 6px; border-radius: 3px;
  letter-spacing: -0.01em;
  flex-shrink: 0;
  white-space: nowrap;
}
.kubun-국내현장 { background: var(--domestic-bg); color: var(--domestic); }
.kubun-국내지사 { background: var(--domestic-bg); color: var(--domestic); }
.kubun-해외현장 { background: var(--overseas-bg); color: var(--overseas); }
.kubun-해외지사 { background: var(--overseas-bg); color: var(--overseas); }
.kubun-해외법인 { background: var(--overseas-bg); color: var(--overseas); }

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; }

.header {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px;
  padding: 18px 32px 14px;
  background: rgba(250, 250, 247, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  min-height: var(--header-h);
}
.crumb { display: flex; gap: 6px; font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
.crumb-sep { color: var(--muted); }
.crumb-current { color: var(--text-2); font-weight: 500; }
.title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }

.title-row {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
}
.title-stats {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 2px;
}
.title-stat {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-size: 12px; color: var(--text-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.title-stat-value {
  font-size: 15px; font-weight: 600;
  color: var(--text); letter-spacing: -0.01em;
}
.title-stat.tone-l1 .title-stat-value { color: var(--l1); }
.title-stat.tone-l2 .title-stat-value { color: var(--l2); }
.title-stat.tone-l3 .title-stat-value { color: var(--l3); }
.title-stat-sep { color: var(--muted); font-size: 11px; }

.header-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.search {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; height: 34px;
  background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px;
  width: 240px; color: var(--text-3);
  transition: border 0.12s;
}
.search:focus-within { border-color: var(--accent); color: var(--text); }
.search input { all: unset; flex: 1; font-size: 13px; color: var(--text); font-family: inherit; }
.search input::placeholder { color: var(--text-3); }
.search-clear {
  all: unset; cursor: pointer; width: 18px; height: 18px;
  border-radius: 4px; display: grid; place-items: center;
  color: var(--text-3); font-size: 16px; line-height: 1;
}
.search-clear:hover { background: var(--surface-2); color: var(--text); }

.view-toggle {
  display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px;
}
.view-toggle button {
  all: unset; cursor: pointer;
  padding: 4px 12px; font-size: 12px; color: var(--text-3);
  border-radius: 4px; font-weight: 500; transition: all 0.12s;
}
.view-toggle button.is-active { background: var(--text); color: var(--surface); }

.kubun-toggle {
  display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px; gap: 1px;
}
.kubun-toggle button {
  all: unset; cursor: pointer;
  padding: 4px 10px; font-size: 12px; color: var(--text-3);
  border-radius: 4px; font-weight: 500; transition: all 0.12s;
}
.kubun-toggle button.is-active { background: var(--text); color: var(--surface); }

.btn-ghost, .btn-primary {
  all: unset; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 34px;
  border-radius: 6px;
  font-size: 12px; font-weight: 500;
  transition: all 0.12s;
}
.btn-ghost {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
}
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }
.btn-ghost.is-on {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text);
}
.btn-warn { color: var(--warn) !important; }
.btn-warn:hover { background: var(--warn-bg); border-color: var(--warn) !important; }
.btn-primary {
  background: var(--text); color: var(--surface);
  border: 1px solid var(--text);
}
.btn-primary:hover { background: #000; }

/* ---------- Content ---------- */
.content { padding: 20px 32px 40px; flex: 1; min-width: 0; }
.empty { padding: 60px 0; text-align: center; color: var(--text-3); font-size: 14px; }

/* ---------- Table ---------- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: visible;
  box-shadow: var(--shadow-sm);
}
.org-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  table-layout: fixed;
}
.org-table thead {
  position: sticky;
  top: var(--header-h);
  z-index: 10;
}
.org-table thead th {
  background: var(--surface-2);
  text-align: left;
  padding: 12px 14px;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-2);
  letter-spacing: -0.01em;
  vertical-align: top;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border-strong);
  box-shadow: 0 1px 0 var(--border-strong);
}
.org-table thead th:first-child { border-top-left-radius: 10px; }
.org-table thead th:last-child { border-top-right-radius: 10px; border-right: 0; }
.th-center { text-align: center !important; }
.th-chip {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 6px; border-radius: 3px;
}
.th-sub {
  display: block; margin-top: 4px;
  font-size: 10px; font-weight: 400; color: var(--text-3);
  letter-spacing: 0; line-height: 1.3;
}

.org-table tbody td {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  vertical-align: top;
  background: var(--surface);
}
.org-table tbody td:last-child { border-right: 0; }
.org-table tbody tr.bonbu-start td { border-top: 2px solid var(--border-strong); }
.org-table tbody tr:first-child td { border-top: 0; }

.cell-bonbu {
  background: var(--surface-2) !important;
  border-right: 1px solid var(--border-strong) !important;
}
.bonbu-cell { padding: 4px 0; position: sticky; top: calc(var(--header-h) + 70px); }
.bonbu-name {
  font-size: 14px; font-weight: 600;
  color: var(--text); letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.bonbu-meta {
  font-size: 11px; color: var(--text-3);
  display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
}
.dot-sep { color: var(--muted); }
.bonbu-breakdown {
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-3);
  display: flex; flex-wrap: wrap;
  gap: 3px; align-items: baseline; line-height: 1.4;
}
.bonbu-breakdown .bb-l2 { color: var(--l2); font-weight: 500; }
.bonbu-breakdown .bb-l3 { color: var(--l3); font-weight: 500; }
.bonbu-breakdown .bb-staff { color: var(--text-2); font-weight: 500; }
.bonbu-breakdown .bb-sep { color: var(--muted); }
.bonbu-kubun-counts {
  margin-top: 8px;
  display: flex; flex-direction: column; gap: 3px;
  font-size: 10px;
}
.bonbu-kubun-row {
  display: flex; justify-content: space-between; gap: 6px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.cell-site {
  background: #fdfcfa;
}
.site-row {
  display: flex; flex-direction: column;
  gap: 4px;
}
.site-name {
  font-size: 13px; font-weight: 500; color: var(--text);
  letter-spacing: -0.005em;
  line-height: 1.35;
}
.site-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.site-bonbu-breakdown {
  font-size: 10px;
  color: var(--text-3);
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 2px;
  line-height: 1.3;
}
.site-bonbu-breakdown .sb-item { white-space: nowrap; }
.site-bonbu-breakdown .sb-sep { color: var(--muted); }

.cell-count {
  text-align: center !important;
  font-variant-numeric: tabular-nums;
}
.member-count {
  display: inline-block;
  min-width: 28px;
  padding: 2px 8px;
  background: var(--surface-2);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.cell-count.is-small {
  background: oklch(0.97 0.06 95) !important;
}
.cell-count.is-small .member-count {
  background: oklch(0.93 0.10 95);
  color: oklch(0.40 0.12 60);
}

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 18, 14, 0.45);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: grid; place-items: center;
  padding: 32px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%;
  max-width: 980px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  overflow: hidden;
}
.modal-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px;
}
.modal-title {
  font-size: 16px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--text);
}
.modal-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }
.modal-close {
  all: unset; cursor: pointer;
  width: 32px; height: 32px;
  border-radius: 6px; display: grid; place-items: center;
  font-size: 22px; color: var(--text-3);
  font-weight: 300;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }

.modal-body {
  display: grid;
  grid-template-columns: 220px 1fr;
  flex: 1;
  min-height: 0;
}
.modal-tabs {
  border-right: 1px solid var(--border);
  background: var(--surface-2);
  padding: 8px;
  display: flex; flex-direction: column;
  gap: 1px;
  overflow-y: auto;
}
.modal-tab {
  all: unset; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
  transition: background 0.12s, color 0.12s;
}
.modal-tab:hover { background: var(--surface); color: var(--text); }
.modal-tab.is-active {
  background: var(--text);
  color: var(--surface);
}
.modal-tab.is-active .modal-tab-count { color: rgba(255,255,255,0.7); }
.modal-tab-count {
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.modal-tab-group { display: flex; flex-direction: column; gap: 1px; margin-bottom: 8px; }
.modal-tab-group:last-child { margin-bottom: 0; }
.modal-tab-group-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-3);
  padding: 8px 12px 4px;
  text-transform: uppercase;
}

.modal-content {
  padding: 18px 24px 24px;
  overflow-y: auto;
}
.modal-section-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 4px;
}
.modal-section-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.modal-section-meta {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.modal-section-note {
  margin: 0 0 16px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}

.modal-empty {
  padding: 40px 20px;
  text-align: center;
  background: var(--surface-2);
  border-radius: 8px;
  color: var(--text-3);
  font-size: 13px;
}
.modal-empty-icon {
  font-size: 32px;
  color: var(--muted);
  margin-bottom: 8px;
}
.modal-empty-sub {
  font-size: 11px;
  margin-top: 4px;
  color: var(--muted);
}

.modal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.modal-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.02em;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  position: sticky; top: 0;
}
.modal-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: top;
}
.modal-table tbody tr:hover td { background: var(--surface-2); }
.modal-tnum {
  color: var(--text-3) !important;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.modal-tname { font-weight: 600; }
.modal-tdept { color: var(--text-2); font-size: 12px; }

/* ---------- Leader cells ---------- */
.leaders-stack {
  display: flex; flex-direction: column;
  gap: 0;
}
.leaders-stack > .leader + .leader {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.leader { display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; }
.leader-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
.leader-dot.dot-l1 { background: var(--l1); }
.leader-dot.dot-l2 { background: var(--l2); }
.leader-dot.dot-l3 { background: var(--l3); }
.leader-text { min-width: 0; flex: 1; }
.leader-name {
  font-weight: 600; font-size: 13px; color: var(--text);
  letter-spacing: -0.01em;
}
.leader-rank { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.leader-title-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  margin-left: 5px;
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 3px;
  letter-spacing: 0;
  vertical-align: middle;
}
.leader-empty { color: var(--muted); font-size: 12px; }
.leader-empty .leader-empty-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--text-3);
  font-weight: 500;
}
.cell-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 14px; }

/* L1 lanes (sub-leader branches) */
.l1-lanes { position: relative; width: 100%; height: 100%; min-height: 100%; }
.cell-l1 { position: relative; padding: 0 !important; }
.cell-l1 > .l1-lanes { padding: 10px 14px; }
.lane-main { display: flex; align-items: flex-start; width: calc(50% - 8px); padding-right: 8px; }
.l1-lanes-solo > .lane-main { width: 100%; }
.lane-branch {
  position: absolute;
  right: 14px;
  width: calc(50% - 14px);
  display: flex;
  align-items: flex-start;
  padding: 8px 0 8px 12px;
  border-left: 1.5px dashed var(--border-strong);
}
.lane-branch::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 50%;
  width: 7px;
  height: 7px;
  background: var(--border-strong);
  border-radius: 50%;
  transform: translateY(-50%);
}
.sub-leader-note { font-size: 10px; color: var(--text-3); margin-top: 2px; font-style: italic; }

mark { background: oklch(0.92 0.10 95); color: var(--text); padding: 0 1px; border-radius: 2px; }

/* ---------- Editable ---------- */
.edit-mode .editable {
  display: inline-block;
  min-width: 24px;
  padding: 0 4px;
  margin: 0 -4px;
  border-radius: 4px;
  outline: 1px dashed var(--border-strong);
  outline-offset: 1px;
  cursor: text;
  transition: outline-color 0.12s, background 0.12s;
}
.edit-mode .editable:hover { outline-color: var(--accent); background: var(--accent-soft); }
.edit-mode .editable.is-editing { outline: 2px solid var(--accent); background: var(--surface); }
.edit-mode .editable.is-empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  font-weight: 400;
  font-size: 11px;
}

/* ---------- Grid View ---------- */
.grid-view {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
}
.card-bonbu {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm);
}
.card-bonbu-head {
  padding: 16px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 16px;
}
.card-bonbu-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.card-bonbu-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.card-bonbu-l1 { text-align: right; }
.card-l1-label {
  font-size: 10px; font-weight: 600; color: var(--l1);
  margin-bottom: 2px; letter-spacing: 0.02em;
}
.card-l1-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.card-l1-name.muted { color: var(--muted); }
.card-l1-rank { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.card-sub-note { font-size: 10px; color: var(--text-3); font-style: italic; margin-top: 1px; }

.card-sites { padding: 6px 0; }
.card-site {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px 18px;
}
.card-site:first-child { border-top: 0; }
.card-site-head {
  display: flex; flex-direction: column; gap: 4px;
}
.card-site-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
.card-site-meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-site-cnt {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
  height: fit-content;
  white-space: nowrap;
}
.card-leaders {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  margin-top: 4px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.card-leader-col-title {
  font-size: 10px; font-weight: 600;
  color: var(--text-3); letter-spacing: 0.02em;
  margin-bottom: 4px;
}
.card-leader-row {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; line-height: 1.3;
  padding: 1px 0;
}
.card-leader-row + .card-leader-row { margin-top: 2px; }
.card-leader-row .dot { width: 5px; height: 5px; border-radius: 50%; }
.card-leader-row .dot-l2 { background: var(--l2); }
.card-leader-row .dot-l3 { background: var(--l3); }
.card-leader-row .l-name { font-weight: 600; color: var(--text); }
.card-leader-row .l-rank { color: var(--text-3); font-size: 11px; }
.card-leader-row .muted { color: var(--muted); }
.dot { width: 5px; height: 5px; border-radius: 50%; }

/* ---------- Stat tones ---------- */
.stat-l1 .stat-value { color: var(--l1); }
.stat-l2 .stat-value { color: var(--l2); }
.stat-l3 .stat-value { color: var(--l3); }

/* ---------- Footer ---------- */
.footer {
  border-top: 1px solid var(--border);
  padding: 18px 32px 24px;
  background: var(--surface);
}
.footer-stats { display: flex; gap: 28px; margin-bottom: 8px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat-value {
  font-size: 22px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text); letter-spacing: -0.02em; line-height: 1;
}
.stat-label { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.footer-note { font-size: 11px; color: var(--text-3); margin-top: 8px; }

/* ---------- Print ---------- */
@media print {
  .sidebar, .header, .footer, .view-toggle, .btn-ghost, .btn-primary, .search, .kubun-toggle, .modal-backdrop { display: none !important; }
  .app { display: block; }
  .content { padding: 16px; }
  .org-table { font-size: 10px; }
  .org-table th, .org-table td { padding: 6px 8px; }
  .org-table thead { position: static !important; }
  body { background: white; }
  .table-wrap { box-shadow: none; }
  .bonbu-cell { position: static; }
}

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .header { flex-direction: column; align-items: stretch; padding: 16px; }
  .header-r { flex-wrap: wrap; }
  .content { padding: 16px; }
}

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

const ORG_INITIAL = window.FIELD_ORG_DATA;
const EXCLUSION_DATA = window.FIELD_EXCLUSION_DATA || {};
const EXCLUSION_META = window.FIELD_EXCLUSION_META || {};
const EXCLUSION_KEYS = window.FIELD_EXCLUSION_KEYS || [];
const STORAGE_KEY = 'field-org-v7';
const KUBUN_LIST = ['전체', '국내현장', '국내지사', '해외현장', '해외지사', '해외법인'];

// ---------- Persistence ----------
function loadOrg() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(ORG_INITIAL));
}
function saveOrg(org) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(org)); } catch (e) {}
}

// ---------- Helpers ----------
function countSites(b) { return b.sites.length; }
function countMembers(b) { return b.stats?.total ?? b.sites.reduce((a,s)=>a+(s.memberCount||0),0); }
function countLeaders(org) {
  let l1=0, l2=0, l3=0;
  const seen2 = new Set(), seen3 = new Set();
  for (const b of org) {
    if (b.leader1?.name) l1++;
    if (b.subLeaders) l1 += b.subLeaders.length;
    for (const s of b.sites) {
      for (const x of (s.leader2||[])) { if (x.empNo && !seen2.has(x.empNo)) { seen2.add(x.empNo); l2++; } else if (!x.empNo) l2++; }
      for (const x of (s.leader3||[])) { if (x.empNo && !seen3.has(x.empNo)) { seen3.add(x.empNo); l3++; } else if (!x.empNo) l3++; }
    }
  }
  return { l1, l2, l3 };
}
function countSitesByKubun(b) {
  const o = {국내현장:0, 국내지사:0, 해외현장:0, 해외지사:0, 해외법인:0};
  for (const s of b.sites) if (o.hasOwnProperty(s.kubun)) o[s.kubun]++;
  return o;
}

// ---------- App ----------
function App() {
  const [org, setOrg] = useState(loadOrg);
  const [activeBonbu, setActiveBonbu] = useState('ALL');
  const [activeKubun, setActiveKubun] = useState('전체');
  const [query, setQuery] = useState('');
  const [view, setView] = useState('table');
  const [editMode, setEditMode] = useState(false);
  const [showExclusions, setShowExclusions] = useState(false);
  const headerRef = useRef(null);

  useEffect(() => { saveOrg(org); }, [org]);

  useEffect(() => {
    const update = () => {
      const h = headerRef.current?.getBoundingClientRect().height || 78;
      document.documentElement.style.setProperty('--header-h', Math.round(h) + 'px');
    };
    update();
    const ro = new ResizeObserver(update);
    if (headerRef.current) ro.observe(headerRef.current);
    window.addEventListener('resize', update);
    return () => { ro.disconnect(); window.removeEventListener('resize', update); };
  }, []);

  const stats = useMemo(() => {
    const lc = countLeaders(org);
    return {
      bonbu: org.length,
      sites: org.reduce((a,b)=>a+countSites(b),0),
      members: org.reduce((a,b)=>a+countMembers(b),0),
      l1: lc.l1, l2: lc.l2, l3: lc.l3,
    };
  }, [org]);

  const filtered = useMemo(() => {
    let data = org;
    if (activeBonbu !== 'ALL') data = data.filter(b => b.bonbu === activeBonbu);
    const q = query.trim().toLowerCase();
    return data.map(b => {
      let sites = b.sites;
      if (activeKubun !== '전체') sites = sites.filter(s => s.kubun === activeKubun);
      if (q) {
        sites = sites.filter(s => {
          if (s.site.toLowerCase().includes(q)) return true;
          if (s.originalSite && s.originalSite.toLowerCase().includes(q)) return true;
          if ((s.leader2||[]).some(x => x.name?.toLowerCase().includes(q))) return true;
          if ((s.leader3||[]).some(x => x.name?.toLowerCase().includes(q))) return true;
          return false;
        });
      }
      if (q && b.leader1?.name?.toLowerCase().includes(q)) return { ...b, sites: b.sites };
      if (q && (b.subLeaders||[]).some(sl => sl.name?.toLowerCase().includes(q))) return { ...b, sites: b.sites };
      if (q && b.bonbu.toLowerCase().includes(q)) return { ...b, sites: b.sites };
      return { ...b, sites };
    }).filter(b => b.sites.length > 0);
  }, [activeBonbu, activeKubun, query, org]);

  const updateOrg = useCallback((mutator) => {
    setOrg(prev => {
      const copy = JSON.parse(JSON.stringify(prev));
      mutator(copy);
      return copy;
    });
  }, []);

  const handleReset = () => {
    if (confirm('모든 편집 내용을 초기화하시겠습니까?')) {
      localStorage.removeItem(STORAGE_KEY);
      setOrg(JSON.parse(JSON.stringify(ORG_INITIAL)));
    }
  };

  return (
    <div className={'app ' + (editMode ? 'edit-mode' : '')}>
      <Sidebar org={org} active={activeBonbu} onPick={setActiveBonbu} stats={stats} />
      <main className="main">
        <Header
          headerRef={headerRef}
          query={query} setQuery={setQuery}
          view={view} setView={setView}
          activeKubun={activeKubun} setActiveKubun={setActiveKubun}
          stats={stats} active={activeBonbu}
          editMode={editMode} setEditMode={setEditMode}
          onReset={handleReset}
          onShowExclusions={() => setShowExclusions(true)}
          org={org}
        />
        <div className="content">
          {view === 'table' ? (
            <TableView org={filtered} highlight={query.trim().toLowerCase()} editMode={editMode} updateOrg={updateOrg} />
          ) : (
            <GridView org={filtered} highlight={query.trim().toLowerCase()} />
          )}

// ---------- Editable ----------
function Editable({ value, onChange, editMode, placeholder, multi }) {
  const ref = useRef(null);
  const [editing, setEditing] = useState(false);
  if (!editMode) return <>{value || placeholder || ''}</>;
  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      className={'editable ' + (editing ? 'is-editing' : '') + (!value ? ' is-empty' : '')}
      data-placeholder={placeholder || ''}
      onFocus={() => setEditing(true)}
      onBlur={(e) => {
        setEditing(false);
        const t = e.currentTarget.innerText.trim();
        if (t !== (value || '')) onChange(t);
      }}
      onKeyDown={(e) => {
        if (!multi && e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
        if (e.key === 'Escape') { e.currentTarget.innerText = value || ''; e.currentTarget.blur(); }
      }}
    >
      {value || ''}
    </span>
  );
}

// ---------- Hi ----------
function Hi({ text, q }) {
  if (!q || !text) return <>{text}</>;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return <>{text}</>;
  return <>{text.slice(0, idx)}<mark>{text.slice(idx, idx + q.length)}</mark>{text.slice(idx + q.length)}</>;
}

// ---------- Leader stack cell ----------
function LeaderStack({ leaders, kind, q, fallback = '공석', editMode, onChange }) {

  if (b.sites.length === 0) {
    return (

        <td className="cell-bonbu"><BonbuCellContent b={b} q={highlight} /></td>

// ---------- Exclusions Modal ----------
function ExclusionsModal({ onClose }) {
  const [active, setActive] = useState(EXCLUSION_KEYS[0]);
  const list = EXCLUSION_DATA[active] || [];
  const meta = EXCLUSION_META[active] || {};
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const groups = {};
  for (const k of EXCLUSION_KEYS) {
    const g = (EXCLUSION_META[k]?.group) || '기타';
    if (!groups[g]) groups[g] = [];
    groups[g].push(k);
  }

  const totalExcluded = EXCLUSION_KEYS.reduce((a, k) => a + (EXCLUSION_DATA[k]?.length || 0), 0);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-title">현장 리더 명단에서 제외된 항목</div>
            <div className="modal-sub">현장 소속(국내·해외 현장/지사/법인) 직원 중 직급이 고문역·자문역·사외이사이거나 근무지가 비상근인 인원입니다. 총 {totalExcluded}명.</div>
          </div>
          <button className="modal-close" onClick={onClose} aria-label="close">×</button>
        </div>
        <div className="modal-body">
          <div className="modal-tabs">
            {Object.entries(groups).map(([g, keys]) => (
              <div className="modal-tab-group" key={g}>
                <div className="modal-tab-group-label">{g}</div>
                {keys.map(k => {
                  const n = (EXCLUSION_DATA[k] || []).length;
                  return (
                    <button key={k} className={'modal-tab ' + (active === k ? 'is-active' : '')} onClick={() => setActive(k)}>
                      <span className="modal-tab-name">{k}</span>
                      <span className="modal-tab-count">{n || '—'}</span>
                    </button>
                  );

            <div className="modal-section-head">
              <h3 className="modal-section-title">{active}</h3>
              <div className="modal-section-meta">{list.length}명</div>
            </div>
            {meta.criteria && <p className="modal-section-note">대상 기준: {meta.criteria} · 근무지구분 = 국내현장·해외현장·국내지사·해외지사·해외법인</p>}
            {list.length === 0 ? (
              <div className="modal-empty">
                <div className="modal-empty-icon">—</div>
                <div>해당 기준에 부합하는 현장 소속 직원이 없습니다.</div>
                <div className="modal-empty-sub">현재 기준 일치 인원 없음 (2026-05-18)</div>
              </div>
            ) : (
              <table className="modal-table">
                <thead>
                  <tr>
                    <th style={{ width: 50 }}>#</th>
                    <th>성명</th>
                    <th>직급</th>
                    <th>직책</th>

                      <td className="modal-tname">{p.name}</td>
                      <td>{p.grade || p.rank || '—'}</td>
                      <td>{p.title || '—'}</td>
                      <td><span className={'kubun-chip kubun-' + p.location}>{p.location}</span></td>
                      <td className="modal-tdept">{p.dept || '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- Excel Export ----------
async function exportExcel(org) {
  if (!window.XLSX) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  const XLSX = window.XLSX;

  const fmtLeader = (l) => l ? `${l.name}${l.title ? ' ('+l.title+')' : ''}${l.rank ? ' · '+l.rank : ''}` : '';
  const fmtLeaders = (arr) => (arr||[]).map(fmtLeader).join('\n') || '공석';

  const aoa = [['본부 / 사업부', '리더 1', '근무지', '근무지구분', '인원', '리더 2', '리더 3']];
  const merges = [];
  let row = 1;
  for (const b of org) {
    const bonbuStart = row;
    let l1 = b.leader1 ? `${b.leader1.name} (${b.leader1.title}, ${b.leader1.rank})` : '';
    if (b.subLeaders) for (const sl of b.subLeaders) l1 += (l1 ? '\n' : '') + `${sl.name} (${sl.title}, ${sl.rank})`;
    if (!l1) l1 = '—';
    if (b.sites.length === 0) {
      aoa.push([b.bonbu, l1, '—', '—', 0, '—', '—']);
      row++;
      continue;
    }
    b.sites.forEach((s, i) => {
      aoa.push([
        i === 0 ? b.bonbu : '',
        i === 0 ? l1 : '',
        s.site,
        s.kubun,
        s.memberCount || 0,
        fmtLeaders(s.leader2),
        fmtLeaders(s.leader3),
      ]);
      row++;
    });
    if (b.sites.length > 1) {
      merges.push({ s: { r: bonbuStart, c: 0 }, e: { r: bonbuStart + b.sites.length - 1, c: 0 } });
      merges.push({ s: { r: bonbuStart, c: 1 }, e: { r: bonbuStart + b.sites.length - 1, c: 1 } });
    }
  }
  const total = org.reduce((a, b) => a + countMembers(b), 0);
  aoa.push([]);
  aoa.push(['합계', '', '', '', total, '', '']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 22 }, { wch: 32 }, { wch: 36 }, { wch: 10 }, { wch: 8 }, { wch: 28 }, { wch: 32 }];

  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = range.s.r; R <= range.e.r; R++) {
    for (let C = range.s.c; C <= range.e.c; C++) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      const cell = ws[addr];
      cell.s = {
        alignment: { vertical: 'top', horizontal: C === 4 ? 'center' : 'left', wrapText: true },
        border: {
          top: { style: 'thin', color: { rgb: 'D5D1C5' } }, bottom: { style: 'thin', color: { rgb: 'D5D1C5' } },
          left: { style: 'thin', color: { rgb: 'D5D1C5' } }, right: { style: 'thin', color: { rgb: 'D5D1C5' } },
        },
        font: { name: 'Pretendard', sz: 10 },
      };
      if (R === 0) {
        cell.s.font = { name: 'Pretendard', sz: 10, bold: true, color: { rgb: 'FFFFFF' } };
        cell.s.fill = { fgColor: { rgb: '2D2A26' }, patternType: 'solid' };
        cell.s.alignment = { vertical: 'center', horizontal: 'center', wrapText: true };
      } else if (C === 0) {
        cell.s.fill = { fgColor: { rgb: 'F5F4EF' }, patternType: 'solid' };
        cell.s.font = { name: 'Pretendard', sz: 10, bold: true };
      } else if (C === 1) {
        cell.s.fill = { fgColor: { rgb: 'FDFCFA' }, patternType: 'solid' };
      }
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '현장 리더 명단');

  // Exclusions sheet
  const exAoa = [['제외 카테고리', '성명', '직급', '직책', '근무지구분', '소속']];
  for (const cat of EXCLUSION_KEYS) {
    const arr = EXCLUSION_DATA[cat] || [];
    if (arr.length === 0) {
      exAoa.push([cat, '(해당 없음)', '', '', '', '']);
    } else {
      arr.forEach((p, i) => exAoa.push([i === 0 ? cat : '', p.name, p.grade || p.rank || '', p.title || '', p.location || '', p.dept || '']));
    }
  }
  const exWs = XLSX.utils.aoa_to_sheet(exAoa);
  exWs['!cols'] = [{ wch: 20 }, { wch: 16 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, exWs, '제외 항목');

  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellStyles: true });
  const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '현장 리더 명단.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
